<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Démos clients</title>
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#f2f1ef;
    background-image: repeating-linear-gradient(115deg, transparent 0 40px, rgba(0,0,0,0.02) 40px 41px, transparent 41px 90px);
    font-family:'Helvetica Neue', Arial, sans-serif;
    color:#171717;
    padding:8vh 6vw;
  }
  .wrap{ max-width:520px; text-align:center; }
  h1{
    font-family:'Georgia', 'Times New Roman', serif;
    font-weight:400;
    font-size:1.4rem;
    letter-spacing:0.03em;
    margin:0 0 10px;
  }
  p.intro{
    font-size:0.9rem; color:#5c5c5c; line-height:1.6;
    margin:0 0 36px;
  }
  ul{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:12px; }
  li a{
    display:block;
    padding:16px 20px;
    border:1px solid #d8d6d3;
    background:#fff;
    color:#171717;
    text-decoration:none;
    font-size:0.95rem;
    letter-spacing:0.02em;
    transition:border-color .2s ease, background .2s ease;
  }
  li a:hover{ border-color:#9a9a9a; background:#faf9f7; }
  li .tag{
    display:block; font-size:0.72rem; color:#9a9a9a; margin-top:4px;
    text-transform:uppercase; letter-spacing:0.08em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Démos clients</h1>
    <p class="intro">Maquettes de sites réalisées à titre de démonstration commerciale.</p>
    <ul>
      <li><a href="/le-duo/">Le Duo — Lounge &amp; Food, Bayonne<span class="tag">Narguilé · Café · Douceurs</span></a></li>
    </ul>
  </div>
</body>
</html>
