<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Skelvo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#F6EFE6;
    background-image: repeating-linear-gradient(115deg, transparent 0 40px, rgba(42,37,33,0.03) 40px 41px, transparent 41px 90px);
    font-family:'Space Grotesk', sans-serif;
    color:#2A2521;
    text-align:center;
    padding:8vh 6vw;
  }
  .mark{
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .mark svg{ display:block; }
  h1{
    font-size:1.3rem; font-weight:600; letter-spacing:0.02em; margin:0;
  }
</style>
</head>
<body>
  <div class="mark">
    <svg width="36" height="30" viewBox="0 0 26 22" fill="none" aria-hidden="true">
      <rect x="0" y="0" width="18" height="7" rx="3.5" fill="#C1613A"/>
      <rect x="8" y="14" width="18" height="7" rx="3.5" fill="#2A2521"/>
    </svg>
    <h1>Skelvo</h1>
  </div>
</body>
</html>
