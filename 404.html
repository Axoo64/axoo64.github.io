<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Page introuvable</title>
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#f2f1ef;
    background-image: repeating-linear-gradient(115deg, transparent 0 40px, rgba(0,0,0,0.02) 40px 41px, transparent 41px 90px);
    font-family:'Georgia', 'Times New Roman', serif;
    color:#171717;
    text-align:center;
    padding:8vh 6vw;
  }
  .wrap{ max-width:440px; }
  .code{
    font-size:clamp(3rem, 10vw, 4.5rem);
    letter-spacing:0.08em;
    color:#9a9a9a;
    margin:0 0 8px;
    font-weight:400;
  }
  h1{
    font-size:1.3rem;
    font-weight:400;
    letter-spacing:0.04em;
    margin:0 0 14px;
  }
  p{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.92rem;
    line-height:1.6;
    color:#5c5c5c;
    margin:0 0 28px;
  }
  a{
    display:inline-block;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:0.8rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:#171717;
    text-decoration:none;
    border:1px solid #171717;
    padding:11px 26px;
    transition:background .2s ease, color .2s ease;
  }
  a:hover{ background:#171717; color:#f2f1ef; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <h1>Cette page n'existe pas</h1>
    <p>Le lien est peut-être mal copié, ou la page a été déplacée.</p>
    <a href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
